<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <title>PODA</title>
  <link rel="icon" href="/static/favicon.svg?v=0.5.0" type="image/svg+xml" />
  <link rel="stylesheet" href="/static/styles.css?v=0.5.0" />
</head>
<body>
  <div class="shell">
    <nav class="rail" aria-label="Primary">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="13.5" fill="none" stroke="#4fb3ff" stroke-width="1.2" opacity=".55"/><circle cx="16" cy="16" r="3.2" fill="#7ee0ff"/><circle cx="7.5" cy="12" r="1.6" fill="#9aa8ff"/><circle cx="24" cy="9.5" r="1.4" fill="#9aa8ff"/><circle cx="22.5" cy="23.5" r="1.6" fill="#9aa8ff"/><path d="M16 16L7.5 12M16 16l8-6.5M16 16l6.5 7.5" stroke="#4fb3ff" stroke-width=".9" opacity=".7"/></svg>
        <div><div class="brand-name">PODA</div><div class="brand-sub">Local assistant</div></div>
      </div>
      <div class="nav" id="nav">
        <button class="nav-item" data-route="ask"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6.5A2.5 2.5 0 0 1 6.5 4h11A2.5 2.5 0 0 1 20 6.5v8a2.5 2.5 0 0 1-2.5 2.5H10l-5 4V17"/></svg><span>Ask</span><kbd class="nav-key">1</kbd></button>
        <button class="nav-item" id="memoryBtn" data-route="memory"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="12" r="2.2"/><circle cx="5" cy="7" r="1.4"/><circle cx="19" cy="6" r="1.4"/><circle cx="18" cy="18" r="1.4"/><circle cx="6" cy="18" r="1.4"/><path d="M12 12L5 7m7 5l7-6m-7 6l6 6m-6-6l-6 6"/></svg><span>Memory</span><kbd class="nav-key">2</kbd></button>
        <button class="nav-item" data-route="plan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M5 5h14M5 12h9M5 19h5"/><circle cx="18" cy="17.5" r="2.5"/></svg><span>Plan</span><kbd class="nav-key">3</kbd></button>
        <button class="nav-item" data-route="notion"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 5v15"/></svg><span>Notion</span><kbd class="nav-key">4</kbd></button>
        <button class="nav-item" data-route="mail"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5.5" width="17" height="13" rx="2"/><path d="M4 7l8 6 8-6"/></svg><span>Mail</span><kbd class="nav-key">5</kbd></button>
        <button class="nav-item" data-route="files"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7.5A1.5 1.5 0 0 1 5.5 6h4l2 2h7A1.5 1.5 0 0 1 20 9.5v8A1.5 1.5 0 0 1 18.5 19h-13A1.5 1.5 0 0 1 4 17.5z"/></svg><span>Files &amp; Agent</span><kbd class="nav-key">6</kbd></button>
        <button class="nav-item" data-route="privacy"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v6c0 4.5-3 7.8-7 9-4-1.2-7-4.5-7-9V6z"/><path d="M9.5 12l2 2 3.5-4"/></svg><span>Privacy</span><kbd class="nav-key">7</kbd></button>
        <button class="nav-item" data-route="system"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 12h8M12 8v8"/></svg><span>System</span><kbd class="nav-key">8</kbd></button>
      </div>
      <div class="rail-footer">
        <span class="local-pill">Local only · 127.0.0.1</span>
        <div>Build <span class="mono" data-build>loading</span></div>
        <div><span class="kbd">⌘K</span> command palette</div>
      </div>
    </nav>

    <section class="workspace">
      <header class="topbar">
        <h1 id="viewTitle">Ask</h1>
        <span class="crumb" id="viewCrumb"></span>
        <div class="topbar-actions">
          <button class="btn btn-ghost btn-sm" id="paletteBtn" aria-label="Open command palette"><span class="kbd">⌘K</span>&nbsp;Commands</button>
          <button class="btn btn-ghost btn-sm inspector-toggle" id="inspectorToggle" aria-label="Toggle inspector">Inspector</button>
        </div>
      </header>
      <main class="view" id="view" tabindex="-1"></main>
    </section>

    <aside class="inspector" id="inspector" aria-label="Inspector">
      <div class="inspector-head"><h2 id="inspectorTitle">Inspector</h2><button class="btn btn-ghost btn-sm inspector-toggle" id="inspectorClose" aria-label="Close inspector">Close</button></div>
      <div class="inspector-body" id="inspectorBody"></div>
    </aside>
  </div>
  <div id="toasts" class="toasts" aria-live="polite"></div>

  <script src="/static/ui.js?v=0.5.0"></script>
  <script src="/static/markdown.js?v=0.5.0"></script>
  <script src="/static/mail.js?v=0.5.0"></script>
  <script src="/static/app.js?v=0.5.0"></script>
</body>
</html>
