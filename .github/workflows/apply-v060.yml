name: Apply PODA v0.6.0 personalization

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-v060.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch, verify, test, and apply PODA v0.6.0
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin poda-v060-import-payload

          : > /tmp/poda-v060.patch.xz.b64
          for n in 00 01 02 03; do
            git show "origin/poda-v060-import-payload:.poda-patch/p${n}" >> /tmp/poda-v060.patch.xz.b64
          done

          base64 --decode /tmp/poda-v060.patch.xz.b64 > /tmp/poda-v060.patch.xz

          expected="5c4b584411707a3ac11d495fb2492d6f8cf5f648662ae22ed119ac74cfd42afc"
          actual="$(sha256sum /tmp/poda-v060.patch.xz | awk '{print $1}')"
          if [ "$actual" != "$expected" ]; then
            echo "Patch integrity failure: expected $expected, got $actual" >&2
            exit 1
          fi

          xz -dc /tmp/poda-v060.patch.xz > /tmp/poda-v060.patch
          patch --batch --forward -p1 < /tmp/poda-v060.patch

          test "$(cat PODA_VERSION.txt)" = "0.6.0-public"
          test -f poda_app/imports/archive.py
          test -f poda_app/imports/profile.py
          test -f poda_app/imports/router.py
          test -f poda_app/imports/service.py
          test -f tests/test_llm_imports.py

          python3 -m compileall -q poda_app
          python3 tools/release_guard.py --check
          python3 -m pip install -q -r requirements.txt pytest
          python3 -m pytest -q tests/test_llm_imports.py tests/test_frontend_static.py tests/test_public_hardening.py

          git config user.name "PODA Release Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit \
            -m "Add local LLM export personalization and semantic topic clouds" \
            -m "Add privacy-first ChatGPT/Claude data export imports, persistent personalization derived only from user-authored text, visible second-brain import memories, duplicate detection, semantic topic-cloud clustering with local embedding/lexical fallback, and support for future chats joining imported topic clouds. Raw import archives are staged locally and deleted after processing."
          git push origin HEAD:main
